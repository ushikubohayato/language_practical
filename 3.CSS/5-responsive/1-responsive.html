<!DOCTYPE html><!--この文書がHTML5で書かれていることを宣言-->

<html><!--HTML文書の開始 -->

<head><!--ページの設定や外部ファイルの読み込みなどを行う部分 -->

    <!--
        スマホ・タブレットなどの画面幅に合わせてページを正しく縮尺表示するための設定。
        width=device-width ... デバイスの実際の画面恥をそのまま使う(拡大しない)
        inital-scale=1.0 ... 表示開始時の拡大率を1(100%)にする
    -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" href="1-responsive.css" /><!--外部CSSファイル「6-flex.css」を読み込む -->
</head>
